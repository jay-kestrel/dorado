[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "pydorado"
version = "2.7.1"
description = "dorado - Lagrangian particle routing routine via weighted random walks"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [
    { name = "J. Hariharan", email = "jayaram.hariharan@utexas.edu" },
    { name = "K. Wright", email = "kyle.wright@twdb.texas.gov" },
    { name = "P. Passalacqua", email = "paola@austin.utexas.edu" }
]
maintainers = [
    { name = "J. Hariharan", email = "jayaram.hariharan@utexas.edu" },
    { name = "K. Wright", email = "kyle.wright@twdb.texas.gov" }
]
classifiers = [
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Programming Language :: Python :: 3.14',
        'Programming Language :: Rust'
]
requires-python = ">=3.11"
dependencies = [
	"numpy",
    "matplotlib",
    "scipy",
    "tqdm"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "coveralls",
    "pydorado[docs]"
]
docs = [
	"sphinx",
	"m2r2",
	"ipython",
	"ipykernel"
]

[project.urls]
"Homepage" = 'https://github.com/passaH2O/dorado'
"Bug Reports" = 'https://github.com/passaH2O/dorado/issues'
"Source" = 'https://github.com/passaH2O/dorado'

[project.scripts]
pydorado = "dorado.cli:main"

[tool.maturin]
# Rust crate in a subdirectory; the Python package stays at the repo root.
manifest-dir = "rust"
python-source = "."
# Build the extension as `dorado/_native` (imported as `dorado._native`).
module-name = "dorado._native"
# Link as a Python extension module (do not link libpython into the cdylib).
features = ["pyo3/extension-module"]



[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# minimal bug-hunter set for a legacy codebase; broaden incrementally
select = ["E9", "F63", "F7", "F82"]
