# Builds the native extension wheels (dorado._native) via cibuildwheel,
# checks their contents, and runs cargo fmt/clippy/test for the rust/ crate.
#
# Repository Actions policy only allows actions from repositories owned by
# jay-kestrel, so the standard checkout/rust-toolchain/cibuildwheel/
# upload-artifact/download-artifact actions cannot be used. Shell equivalents
# do the job instead, mirroring build.yml's actions-free pattern: a shell
# fetch of the PR merge ref, rustup installed from its release script, and
# the cibuildwheel CLI invoked directly (pinned to 4.3.5, the version the
# pypa/cibuildwheel action resolved to; the action is a thin wrapper that
# forwards CIBW_* env to that CLI). The upload-artifact action is
# policy-blocked, so the wheel-content check runs inside each build job and
# wheels stay in the job workspace instead of being shared across jobs.

name: wheels

on:
  pull_request:
    paths:
      - "rust/**"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  push:
    branches: [master]
    paths:
      - "rust/**"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source (shell fetch; external actions are blocked by repo policy)
        env:
          REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q "$GITHUB_WORKSPACE"
          git fetch -q --depth=1 "https://github.com/${{ github.repository }}.git" "$REF"
          git checkout -q --detach FETCH_HEAD
      - name: Install Rust toolchain (shell rustup; external actions are blocked by repo policy)
        run: |
          # Replaces dtolnay/rust-toolchain@stable (policy-blocked), with the
          # same rustfmt + clippy components the action was configured with.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # pyo3 links libpython when building the test binary (the
      # extension-module feature is only enabled by maturin for wheels).
      - name: Install libpython for cargo test linking
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpython3-dev
      - name: cargo fmt
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path rust/Cargo.toml

  wheels:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel (x86_64) rather than macos-latest (arm64): the arm64
        # hosted-runner pool repeatedly failed runner acquisition during
        # capacity crunches; the Intel pool is a different pool (same label
        # the pytest matrix uses).
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"  # ubuntu system python is externally managed
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source (shell fetch; external actions are blocked by repo policy)
        env:
          REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q "$GITHUB_WORKSPACE"
          git fetch -q --depth=1 "https://github.com/${{ github.repository }}.git" "$REF"
          git checkout -q --detach FETCH_HEAD
      - name: Install Rust toolchain (shell rustup; external actions are blocked by repo policy)
        run: |
          # maturin compiles the native extension during wheel builds and
          # needs rustc >= 1.85 (pyo3 0.30 MSRV).
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build wheels (cibuildwheel CLI; external actions are blocked by repo policy)
        env:
          # One interpreter per OS; the pyo3 abi3-py311 feature tags the
          # produced wheel cp311-abi3-* so it serves all Python >= 3.11.
          # Pinned to one platform tag per OS: cibuildwheel 4 defaults would
          # also build musllinux (2nd linux pass) and win32 (no modern numpy
          # win32 wheels to pair with), doubling build time for artifacts
          # most users cannot install.
          CIBW_BUILD: "cp312-manylinux_x86_64 cp312-macosx_x86_64 cp312-win_amd64"
        run: |
          if command -v python >/dev/null 2>&1; then PY=python; else PY=python3; fi
          "$PY" -m pip install "cibuildwheel==4.3.5"
          "$PY" -m cibuildwheel --output-dir wheelhouse
      # The upload-artifact/download-artifact actions are policy-blocked, so
      # the old aggregated wheel-content job is folded into each build job:
      # every matrix job asserts its own wheel exists with the _native
      # extension and the bundled .npz example data, which across the matrix
      # covers the same linux/macos/windows families the aggregated check
      # asserted.
      - name: Check wheel contents (_native extension + example .npz data)
        run: |
          if command -v python >/dev/null 2>&1; then PY=python; else PY=python3; fi
          "$PY" - <<'EOF'
          import glob
          import os
          import zipfile

          wheels = sorted(glob.glob("wheelhouse/*.whl"))
          assert wheels, f"no wheels found in wheelhouse ({os.environ.get('RUNNER_OS', 'unknown runner os')})"
          for whl in wheels:
              names = zipfile.ZipFile(whl).namelist()
              native = [
                  n for n in names
                  if n.startswith("dorado/_native")
                  and (n.endswith(".so") or n.endswith(".pyd"))
              ]
              npz = [n for n in names if n.startswith("dorado/") and n.endswith(".npz")]
              assert native, f"{whl}: _native extension missing from wheel: {names}"
              assert npz, f"{whl}: example .npz data missing from wheel: {names}"
              print(f"{whl}: {native[0]} + {len(npz)} .npz data files")
          print("wheel contents OK")
          EOF
